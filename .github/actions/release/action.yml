name: Create GitHub Release
description: >-
  Creates a GitHub release from artifacts. Supports both direct file upload
  and pre-built artifact download. Optionally generates release notes via OpenCode.

inputs:
  tag:
    description: "Release tag (e.g. v1.0.0)"
    required: true
  name:
    description: "Release title"
    required: false
    default: ""
  artifacts:
    description: "Glob pattern for files to upload (e.g. 'dist/*')"
    required: false
    default: ""
  artifact-pattern:
    description: "Artifact names to download (leave empty to skip download)"
    required: false
    default: ""
  notes-file:
    description: "Path to release notes file"
    required: false
    default: ""
  generate-notes:
    description: "Use GitHub's auto-generated release notes"
    required: false
    default: "true"
  use-opencode:
    description: "Generate release notes with OpenCode AI"
    required: false
    default: "false"
  opencode-api-key:
    description: "OpenCode API key (pass the repo's OPENCODE_API_KEY secret)"
    required: false
    default: ""
  opencode-model:
    description: "OpenCode model for release notes generation"
    required: false
    default: "opencode/deepseek-v4-flash-free"

runs:
  using: composite
  steps:
    - name: Download artifacts
      if: inputs.artifact-pattern != ''
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: artifacts
        merge-multiple: true

    - name: Generate release notes with OpenCode
      if: inputs.use-opencode == 'true'
      shell: bash
      env:
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
      run: |
        curl -fsSL https://opencode.ai/install.sh | bash
        export PATH="$HOME/.opencode/bin:$PATH"

        PREV_TAG=$(git describe --tags --abbrev=0 "${{ inputs.tag }}~1" 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          LOG=$(git log --oneline --no-merges "${PREV_TAG}..${{ inputs.tag }}")
        else
          LOG=$(git log --oneline --no-merges -20)
        fi
        echo "$LOG" > /tmp/git-log.txt

        opencode run \
          --model "${{ inputs.opencode-model }}" \
          --prompt "Write release notes for this release. Read /tmp/git-log.txt for the commit log. Group changes into: Highlights, New Features, Bug Fixes, Improvements. Write the result to RELEASE_NOTES.md. Keep under 60 lines." \
          2>/dev/null || echo "OpenCode unavailable"

        if [ ! -s RELEASE_NOTES.md ]; then
          echo "$LOG" > RELEASE_NOTES.md
        fi

    - name: Create GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        NOTES_ARGS=""
        if [ -n "${{ inputs.notes-file }}" ] && [ -f "${{ inputs.notes-file }}" ]; then
          NOTES_ARGS="--notes-file ${{ inputs.notes-file }}"
        elif [ -f "RELEASE_NOTES.md" ]; then
          NOTES_ARGS="--notes-file RELEASE_NOTES.md"
        elif [ "${{ inputs.generate-notes }}" = "true" ]; then
          NOTES_ARGS="--generate-release-notes"
        else
          NOTES_ARGS="--notes ''"
        fi

        UPLOAD_FILES=""
        if [ -d "artifacts" ]; then
          UPLOAD_FILES=$(find artifacts -type f -not -name '*.md' | tr '\n' ' ')
        fi
        if [ -n "${{ inputs.artifacts }}" ]; then
          UPLOAD_FILES="$UPLOAD_FILES ${{ inputs.artifacts }}"
        fi

        TITLE="${{ inputs.name || inputs.tag }}"
        gh release create "${{ inputs.tag }}" \
          $UPLOAD_FILES \
          --title "$TITLE" \
          $NOTES_ARGS \
          --clobber
