name: KMP setup
description: Set up JDK + Gradle cache for Kotlin Multiplatform builds

inputs:
  java-version:
    description: JDK version
    default: "21"
  gradle-version:
    description: Gradle wrapper version (empty = auto-detect from gradle/wrapper/gradle-wrapper.properties)
    default: ""

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Cache Gradle
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set Gradle wrapper version
      if: inputs.gradle-version != ''
      shell: bash
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew wrapper --gradle-version=${{ inputs.gradle-version }} --distribution-type=bin
        fi
