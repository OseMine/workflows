name: Setup Rust
description: Install the stable Rust toolchain with optional components, enable build caching, and optionally install system dev headers (ALSA, etc.).

inputs:
  rust-toolchain:
    description: Rust toolchain to install (e.g. stable, 1.80, nightly)
    required: false
    default: stable
  components:
    description: Space-separated rustup components to install (e.g. "fmt clippy")
    required: false
    default: ""
  cache:
    description: Enable the shared Rust build cache (true/false)
    required: false
    default: "true"
  alsa:
    description: Install libasound2-dev (true/false)
    required: false
    default: "false"
  packages:
    description: Extra apt packages to install (space separated)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.components }}

    - name: Enable Rust cache
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@v2

    - name: Install ALSA development headers
      if: ${{ inputs.alsa == 'true' }}
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      shell: bash

    - name: Install extra apt packages
      if: inputs.packages != ''
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.packages }}
      shell: bash