name: Setup Python
description: >-
  Installs Python with pip caching and project dependencies.
  Supports requirements.txt, pyproject.toml, or custom dependency files.

inputs:
  python-version:
    description: "Python version (e.g. '3.11', '3.12', '3.x')"
    required: false
    default: "3.11"
  requirements:
    description: "Path to requirements file (e.g. 'requirements.txt')"
    required: false
    default: "requirements.txt"
  extra-deps:
    description: "Extra pip packages to install (space separated)"
    required: false
    default: ""
  cache:
    description: "Enable pip caching"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Get pip cache directory
      if: inputs.cache == 'true'
      id: pip-cache
      shell: bash
      run: echo "dir=$(pip cache dir)" >> "$GITHUB_OUTPUT"

    - name: Cache pip dependencies
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.pip-cache.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles(inputs.requirements) }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ inputs.requirements }}" ]; then
          pip install -r "${{ inputs.requirements }}"
        fi
        if [ -n "${{ inputs.extra-deps }}" ]; then
          pip install ${{ inputs.extra-deps }}
        fi
