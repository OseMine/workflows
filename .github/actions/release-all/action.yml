name: Release
description: >-
  Unified release pipeline. Two modes:
  - full (default): version resolution -> builds -> security gate -> AI notes -> GitHub release with SHA256SUMS + manifest
  - simple: download artifacts / use local files -> create GitHub release (with optional AI/auto-generated notes)
author: gha-workflows

inputs:
  mode:
    description: "Pipeline mode. 'full' = builds + security + AI notes; 'simple' = artifacts + release only."
    required: false
    default: full
  language:
    description: "Main stack: auto, rust, tauri, node, python, flutter, kmp, php, lua. Comma-separated."
    required: false
    default: auto
  release-tag:
    description: "Version tag to use. Empty = auto-detect from pubspec.yaml / Cargo.toml / package.json."
    required: false
  draft:
    description: "Create the release as a draft."
    required: false
    default: "false"
  prerelease:
    description: "Mark as prerelease (default false, or auto from semver pre-release tags)."
    required: false
  github-token:
    description: "Token for creating the release. Defaults to github.token."
    required: false
  build:
    description: "Comma-separated artifact groups (cargo, tauri, plugin, installer, python, android, ios, flutter). 'all' = everything."
    required: false
    default: all
  min-rating:
    description: "Minimum security rating (0-10) required to release. 0 disables."
    required: false
    default: "7"
  security:
    description: "Run security gate before releasing."
    required: false
    default: "true"
  ios-scheme:
    description: "Xcode scheme name for native iOS build (forwarded to ios-build)."
    required: false
    default: ""
  provider:
    description: "Primary AI provider for notes + security (custom, opencode, google, openai, mistral, anthropic, x, deepseek, groq, puter, together, cerebras, openrouter, huggingface, lmstudio, ollama)."
    required: false
    default: opencode
  model:
    description: "Primary model. 'provider/model' or just the model id (provider input is prepended automatically). Special values: 'auto' (pick best available based on API keys), 'auto-free' (pick best free-tier model)."
    required: false
    default: auto-free
  api-key:
    description: "API key for primary provider."
    required: false
  fallback-provider:
    description: "Fallback AI provider."
    required: false
    default: opencode
  fallback-model:
    description: "Fallback model. Special values: 'auto', 'auto-free'."
    required: false
    default: auto-free
  fallback-api-key:
    description: "API key for fallback provider."
    required: false
  custom-api-base:
    description: "Base URL for the custom provider (OpenAI-compatible, e.g. https://api.example.com/v1). Required when provider=custom."
    required: false
  custom-api-key:
    description: "API key for the custom provider (defaults to api-key)."
    required: false
  custom-model:
    description: "Model id to use with the custom provider (overrides `model`)."
    required: false
  opencode-version:
    description: "opencode-ai npm version for AI release notes."
    required: false
    default: 1.18.29
  artifact-pattern:
    description: "Artifact names to download (leave empty to skip download)."
    required: false
    default: ""
  artifacts:
    description: "Glob pattern for local files to upload (e.g. 'dist/*')."
    required: false
    default: ""
  notes-file:
    description: "Path to pre-written release notes file."
    required: false
    default: ""
  generate-notes:
    description: "Use GitHub's auto-generated release notes."
    required: false
    default: "true"
  release-notes-command:
    description: "Custom command for release notes (disables AI + git-log). Env gets RELEASE_TAG/RELEASE_NAME."
    required: false
  version-file:
    description: "Path to a version file to consume when auto-detecting."
    required: false
  use-opencode:
    description: "Deprecated; use provider/model/api-key instead."
    required: false
    default: "false"
  opencode-api-key:
    description: "Deprecated alias for api-key."
    required: false
    default: ""
  opencode-model:
    description: "Deprecated alias for model."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve meta (version, build flags)
      id: meta
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TAG: ${{ inputs.release-tag }}
        VERSION_FILE: ${{ inputs.version-file }}
        BUILD: ${{ inputs.build }}
      run: |-
        set -euo pipefail
        echo "::group::Meta resolution"
        VERSION=""
        RELEASE_TAG="$TAG"
        if [ -z "$RELEASE_TAG" ]; then
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            RELEASE_TAG="v${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "v" ]; then
            for f in "${VERSION_FILE:-}" pubspec.yaml Cargo.toml package.json; do
              [ -f "$f" ] || continue
              case "$f" in
                pubspec.yaml) VERSION=$(grep -m1 '^version:' "$f" | awk '{print $2}' | tr -d "'\"") ;;
                Cargo.toml)   VERSION=$(grep -m1 '^version' "$f" | sed -E 's/^version\s*=\s*"([^"]+)"/\1/') ;;
                package.json) VERSION=$(grep -m1 '"version"' "$f" | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/') ;;
              esac
              [ -n "$VERSION" ] && break
            done
            RELEASE_TAG="v${VERSION}"
          fi
        fi
        SEMVER="${RELEASE_TAG#v}"
        if [[ "$SEMVER" =~ ^v[0-9] ]]; then SEMVER="${SEMVER#v}"; fi
        if ! [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "::error::Invalid semver tag '$RELEASE_TAG' (expected vX.Y.Z)"
          exit 1
        fi
        RELEASE_NAME="Release $SEMVER"
        VERSION="$SEMVER"

        if [ -n "$GITHUB_REF" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TRIGGERED_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TRIGGERED_TAG" != "$RELEASE_TAG" ]; then
            echo "::warning::triggered tag '$TRIGGERED_TAG' differs from detected version '$RELEASE_TAG'"
          fi
        fi

        FLAGS=""
        REQUESTED="$BUILD"
        [ -z "$REQUESTED" ] && REQUESTED="all"
        [ "$REQUESTED" = "all" ] && { REQUESTED="cargo,tauri,plugin,installer,python,android,ios,flutter"; }
        IFS=',' read -ra arr <<< "$REQUESTED"
        for b in "${arr[@]}"; do
          case "$b" in
            all)                CONTINUE=1 ;;
            cargo)              FLAGS="${FLAGS},cargo" ;;
            tauri)              FLAGS="${FLAGS},tauri" ;;
            plugin|vst|clap)    FLAGS="${FLAGS},plugin" ;;
            installer|innosetup) FLAGS="${FLAGS},installer" ;;
            python|pyinstaller) FLAGS="${FLAGS},python" ;;
            android|apk)        FLAGS="${FLAGS},android" ;;
            ios|ipa)            FLAGS="${FLAGS},ios" ;;
            flutter)            FLAGS="${FLAGS},flutter" ;;
            *) echo "::warning::unknown build flag '$b'" ;;
          esac
        done
        FLAGS="${FLAGS#,}"

        LANG="${{ inputs.language }}"
        [ -z "$LANG" ] || [ "$LANG" = "auto" ] && LANG="rust,node,python,flutter,kmp,php,lua,tauri"
        PRUNED=""
        IFS=',' read -ra la <<< "$LANG"
        for flag in cargo tauri plugin installer python android ios flutter; do
          echo ",$FLAGS," | grep -q ",$flag," || continue
          echo ",$PRUNED," | grep -q ",$flag," && continue
          PRUNED="${PRUNED},$flag"
        done
        echo "build_flags=${FLAGS}" >> "$GITHUB_OUTPUT"
        echo "language=$LANG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
        echo "meta: tag=$RELEASE_TAG name=$RELEASE_NAME flags=$FLAGS"

    - name: Resolve language (auto-detect if not given)
      if: ${{ inputs.mode == 'full' }}
      id: lang
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        LANG: ${{ inputs.language }}
      run: |-
        set -euo pipefail
        if [ -z "$LANG" ] || [ "$LANG" = "auto" ]; then
          LANG=""
          [ -f Cargo.toml ] && LANG="${LANG},rust"
          [ -d src-tauri ] && [ -f Cargo.toml ] && LANG="tauri"
          [ -f pubspec.yaml ] && LANG="${LANG},flutter"
          [ -f package.json ] && LANG="${LANG},node"
          { [ -f pyproject.toml ] || [ -f setup.py ]; } && LANG="${LANG},python"
          LANG="${LANG#,}"
          [ -z "$LANG" ] && LANG="none"
        fi
        echo "language=$LANG" >> "$GITHUB_OUTPUT"

    - name: Run security gate
      if: ${{ inputs.mode == 'full' && inputs.security == 'true' }}
      uses: OseMine/workflows/.github/actions/security@main
      with:
        min-rating: ${{ inputs.min-rating }}
        provider: ${{ inputs.provider }}
        model: ${{ inputs.model }}
        api-key: ${{ inputs.api-key }}
        fallback-provider: ${{ inputs.fallback-provider }}
        fallback-model: ${{ inputs.fallback-model }}
        fallback-api-key: ${{ inputs.fallback-api-key }}
        custom-api-base: ${{ inputs.custom-api-base }}
        custom-api-key: ${{ inputs.custom-api-key }}
        custom-model: ${{ inputs.custom-model }}
        virustotal-api-key: ""

    - name: Rust / Cargo release build
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'cargo') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        FLAGS="${{ steps.meta.outputs.build_flags }}"
        if echo ",$FLAGS," | grep -q ",cargo,"; then
          echo "::group::cargo build --release"
          cargo build --release --locked 2>/dev/null || cargo build --release
          echo "::endgroup::"
        fi

    - name: Python package (sdist + wheel)
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'python') }}
      uses: OseMine/workflows/.github/actions/python-build@main

    - name: Flutter APK + AAB + IPA
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'flutter') }}
      uses: OseMine/workflows/.github/actions/flutter-build@main

    - name: Android APK (native)
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'android') }}
      uses: OseMine/workflows/.github/actions/android-build@main

    - name: iOS unsigned IPA (native)
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'ios') && inputs.ios-scheme != '' }}
      uses: OseMine/workflows/.github/actions/ios-build@main
      with:
        scheme: ${{ inputs.ios-scheme }}

    - name: KMP Android build
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'android') && contains(steps.lang.outputs.language, 'kmp') }}
      uses: OseMine/workflows/.github/actions/kmp-android-build@main

    - name: Collect artifacts
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        set -euo pipefail
        mkdir -p dist

        if [ -n "${{ inputs.artifact-pattern }}" ]; then
          echo "::group::Download artifacts"
          echo "Artifact pattern provided: ${{ inputs.artifact-pattern }}"
          echo "::endgroup::"
        fi

        if [ "${{ inputs.mode }}" = "full" ]; then
          for dir in target/release dist/release build/Release dist_signed/bin artifacts out; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name '*.tar.gz' -o -name '*.whl' -o -name '*.zip' -o -name '*.nocache' \) 2>/dev/null -print0 | xargs -0 -r -I{} cp -n {} dist/ 2>/dev/null || true
          done
        else
          if [ -n "${{ inputs.artifacts }}" ]; then
            echo "Collecting local artifacts: ${{ inputs.artifacts }}"
            find . -name "${{ inputs.artifacts }}" -type f -exec cp -n {} dist/ \; 2>/dev/null || true
          fi
        fi

    - name: Download workflow artifacts
      if: ${{ inputs.mode == 'simple' && inputs.artifact-pattern != '' }}
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: artifacts
        merge-multiple: true

    - name: Merge downloaded artifacts into dist
      if: ${{ inputs.mode == 'simple' && inputs.artifact-pattern != '' }}
      shell: bash
      run: |
        if [ -d "artifacts" ]; then
          cp -n artifacts/* dist/ 2>/dev/null || true
        fi

    - name: Generate SHA256SUMS + manifest
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        set -euo pipefail
        if [ -z "$(find dist -type f | head -1)" ]; then
          echo "::warning::no artifacts found for checksums"
          exit 0
        fi
        (cd dist && sha256sum * > SHA256SUMS.txt 2>/dev/null || true)
        find dist -maxdepth 1 -type f | xargs -I{} basename {} > dist/manifest.txt
        if command -v jq >/dev/null; then
          echo '{' > dist/release-manifest.json
          (cd dist && sha256sum *) | while read -r h f; do
            echo "  \"$f\": \"$h\"," >> dist/release-manifest.json
          done
          echo '}' >> dist/release-manifest.json
        fi
        echo "checksums:"
        (cd dist && cat SHA256SUMS.txt 2>/dev/null || true)
        VERSION="${{ steps.meta.outputs.version }}"
        echo "$VERSION\n$(date -u +%Y-%m-%d)" > dist/VERSION.txt

    - name: Generate release notes
      id: notes
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        OPENCODE_PKG: opencode-ai@${{ inputs.opencode-version }}
        PROV1: ${{ inputs.provider }}
        MODEL1: ${{ inputs.model }}
        KEY1: ${{ inputs.api-key != '' && inputs.api-key || inputs.opencode-api-key }}
        PROV2: ${{ inputs.fallback-provider }}
        MODEL2: ${{ inputs.fallback-model }}
        KEY2: ${{ inputs.fallback-api-key }}
        CUSTOM_BASE: ${{ inputs.custom-api-base }}
        CUSTOM_KEY: ${{ inputs.custom-api-key }}
        CUSTOM_MODEL: ${{ inputs.custom-model }}
      run: |-
        set -uo pipefail
        source "${{ github.action_path }}/../lib-ai/ai.bash"

        mkdir -p reports
        NOTES="reports/release-notes-${RELEASE_TAG}.md"

        if [ -n "${{ inputs.notes-file }}" ] && [ -f "${{ inputs.notes-file }}" ]; then
          cp "${{ inputs.notes-file }}" "$NOTES"
          echo "Using pre-written notes from ${{ inputs.notes-file }}"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        run_notes() {
          local m="$1"
          echo "--- release notes via: $m ---"
          npx --yes "$OPENCODE_PKG" run --auto --model "$m" \
            "Write concise release notes for version ${RELEASE_NAME} from git history. Include categories: Features, Fixes, Breaking. Use bullets. No preamble." \
            > "$NOTES" 2>&1 || return 1
        }

        wrote=0
        if [ -n "${{ inputs.release-notes-command }}" ]; then
          eval "${{ inputs.release-notes-command }}" > "$NOTES" 2>&1 || true
          wrote=1
        else
          FREE1=0; [ "$MODEL1" = "auto-free" ] && FREE1=1
          RESOLVED_MODEL1=$(ai_resolve "$MODEL1" "$PROV1" "$KEY1" "$PROV2" "$MODEL2" "$KEY2")
          FULL1=$(ai_prepare "$RESOLVED_MODEL1" "$KEY1" "$FREE1") || FULL1=""
          if [ -n "$FULL1" ] && run_notes "$FULL1"; then
            wrote=1
          else
            echo "::warning::AI notes failed with $FULL1, trying fallback"
            FREE2=0; [ "$MODEL2" = "auto-free" ] && FREE2=1
            RESOLVED_MODEL2=$(ai_resolve "$MODEL2" "$PROV2" "$KEY2" "" "" "")
            FULL2=$(ai_prepare "$RESOLVED_MODEL2" "$KEY2" "$FREE2") || FULL2=""
            if [ -n "$FULL2" ] && run_notes "$FULL2"; then
              wrote=1
            else
              rm -f "$NOTES"
            fi
          fi
        fi

        if [ ! -s "$NOTES" ]; then
          echo "## $RELEASE_NAME" > "$NOTES"
          echo "" >> "$NOTES"
          git log --oneline "$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" 2>/dev/null >> "$NOTES" || \
            git log --oneline -20 >> "$NOTES" || true
          echo "(notes generated from git log -- run with api-key for AI notes)" >> "$NOTES"
        fi
        echo "path=$NOTES" >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      uses: OseMine/workflows/.github/actions/github-release@main
      with:
        github-token: ${{ inputs.github-token || github.token }}
        tag: ${{ steps.meta.outputs.release_tag }}
        body-file: ${{ steps.notes.outputs.path }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        assets: dist/*