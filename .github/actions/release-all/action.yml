name: Release all platforms
description: >-
  One-call release pipeline for this collection. Resolves the version from the
  tag or project files, validates semver, runs the per-language builds, applies
  the security gate, generates AI release notes (with deterministic git-log
  fallback), and creates the GitHub release with SHA256SUMS +
  release-manifest.json. Update logic here once, consume everywhere.
author: gha-workflows

inputs:
  language:
    description: >-
      Main stack: auto, rust, tauri, node, python, flutter, kmp, php, lua.
      Comma-separated lists allowed.
    required: false
    default: auto
  build:
    description: >-
      Comma-separated artifact groups to build. Supported: cargo, tauri,
      plugin, installer, python, android, ios, flutter. 'all' builds
      everything applicable.
    required: false
    default: all
  release-tag:
    description: Version tag to use. Empty = auto-detect from pubspec.yaml /
      Cargo.toml / package.json.
    required: false
  min-rating:
    description: Minimum security rating (0-10) required to release. 0 disables.
    required: false
    default: "7"
  draft:
    description: Create the release as a draft.
    required: false
    default: "false"
  prerelease:
    description: >-
      Mark the release as a prerelease (default false, or automatic from semver
      pre-release tags).
    required: false
  github-token:
    description: Token for creating the release. Defaults to github.token.
    required: false
  security:
    description: Run the security gate before releasing.
    required: false
    default: "true"
  release-notes-command:
    description: Custom command/script for release notes. Env gets
      RELEASE_TAG/RELEASE_NAME. Disables the AI + git-log defaults.
    required: false
  opencode-version:
    description: opencode-ai npm version for AI release notes.
    required: false
    default: 1.18.29
  provider:
    description: Primary AI provider for notes + security review (opencode, google, openai, mistral, anthropic, x, deepseek, groq, puter, ollama).
    required: false
    default: opencode
  model:
    description: Primary model ('provider/model' or model id).
    required: false
    default: deepseek-v4-flash-free
  api-key:
    description: API key for the primary provider.
    required: false
  fallback-provider:
    description: Fallback AI provider.
    required: false
    default: opencode
  fallback-model:
    description: Fallback model.
    required: false
    default: gpt-4o-mini
  fallback-api-key:
    description: API key for the fallback provider (optional).
    required: false
  version-file:
    description: Path to a version file to consume when auto-detecting.
    required: false

runs:
  using: composite
  steps:
    - name: Resolve meta (version, build flags)
      id: meta
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TAG: ${{ inputs.release-tag }}
        VERSION_FILE: ${{ inputs.version-file }}
        BUILD: ${{ inputs.build }}
      run: |-
        set -euo pipefail
        echo "::group::Meta resolution"
        # --- version source ---
        VERSION=""
        RELEASE_TAG="$TAG"
        if [ -z "$RELEASE_TAG" ]; then
          # Only derive from GITHUB_REF on a tag push, not workflow_dispatch
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            RELEASE_TAG="v${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "v" ]; then
            for f in "${VERSION_FILE:-}" pubspec.yaml Cargo.toml package.json; do
              [ -f "$f" ] || continue
              case "$f" in
                pubspec.yaml) VERSION=$(grep -m1 '^version:' "$f" | awk '{print $2}' | tr -d "'\"") ;;
                Cargo.toml)   VERSION=$(grep -m1 '^version' "$f" | sed -E 's/^version\s*=\s*"([^"]+)"/\1/') ;;
                package.json) VERSION=$(grep -m1 '"version"' "$f" | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/') ;;
              esac
              [ -n "$VERSION" ] && break
            done
            RELEASE_TAG="v${VERSION}"
          fi
        fi
        # strip leading v for semver check
        SEMVER="${RELEASE_TAG#v}"
        if [[ "$SEMVER" =~ ^v[0-9] ]]; then SEMVER="${SEMVER#v}"; fi
        if ! [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "::error::Invalid semver tag '$RELEASE_TAG' (expected vX.Y.Z)"
          exit 1
        fi
        RELEASE_NAME="Release $SEMVER"
        VERSION="$SEMVER"

        # --- create branch/tag consistency check ---
        if [ -n "$GITHUB_REF" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TRIGGERED_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TRIGGERED_TAG" != "$RELEASE_TAG" ]; then
            echo "::warning::triggered tag '$TRIGGERED_TAG' differs from detected version '$RELEASE_TAG'"
          fi
        fi

        # --- build flags ---
        FLAGS=""
        REQUESTED="$BUILD"
        [ -z "$REQUESTED" ] && REQUESTED="all"
        [ "$REQUESTED" = "all" ] && { REQUESTED="cargo,tauri,plugin,installer,python,android,ios,flutter"; }
        IFS=',' read -ra arr <<< "$REQUESTED"
        for b in "${arr[@]}"; do
          case "$b" in
            all)                CONTINUE=1 ;;
            cargo)              FLAGS="${FLAGS},cargo" ;;
            tauri)              FLAGS="${FLAGS},tauri" ;;
            plugin|vst|clap)    FLAGS="${FLAGS},plugin" ;;
            installer|innosetup) FLAGS="${FLAGS},installer" ;;
            python|pyinstaller) FLAGS="${FLAGS},python" ;;
            android|apk)        FLAGS="${FLAGS},android" ;;
            ios|ipa)            FLAGS="${FLAGS},ios" ;;
            flutter)            FLAGS="${FLAGS},flutter" ;;
            *) echo "::warning::unknown build flag '$b'" ;;
          esac
        done
        FLAGS="${FLAGS#,}"

        # language-aware pruning: only build what matches the stack
        LANG="${{ inputs.language }}"
        [ -z "$LANG" ] || [ "$LANG" = "auto" ] && LANG="rust,node,python,flutter,kmp,php,lua,tauri"
        PRUNED=""
        IFS=',' read -ra la <<< "$LANG"
        for flag in cargo tauri plugin installer python android ios flutter; do
          echo ",$FLAGS," | grep -q ",$flag," || continue
          # keep plugin/installer for rust builds unless python package named
          echo ",$PRUNED," | grep -q ",$flag," && continue
          PRUNED="${PRUNED},$flag"
        done
        # allow plugin/installer/payload builds for rust/tauri stacks even
        # defaulting to not being language entries -- they map through cargo
        echo "build_flags=${FLAGS}" >> "$GITHUB_OUTPUT"
        echo "language=$LANG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
        echo "meta: tag=$RELEASE_TAG name=$RELEASE_NAME flags=$FLAGS"

    - name: Resolve language (auto-detect if not given)
      id: lang
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        LANG: ${{ inputs.language }}
      run: |-
        set -euo pipefail
        if [ -z "$LANG" ] || [ "$LANG" = "auto" ]; then
          LANG=""
          [ -f Cargo.toml ] && LANG="${LANG},rust"
          [ -d src-tauri ] && [ -f Cargo.toml ] && LANG="tauri"
          [ -f pubspec.yaml ] && LANG="${LANG},flutter"
          [ -f package.json ] && LANG="${LANG},node"
          { [ -f pyproject.toml ] || [ -f setup.py ]; } && LANG="${LANG},python"
          LANG="${LANG#,}"
          [ -z "$LANG" ] && LANG="none"
        fi
        echo "language=$LANG" >> "$GITHUB_OUTPUT"

    - name: Run security gate
      if: ${{ inputs.security == 'true' }}
      uses: YOUR_ORG/gha-workflows/.github/actions/security@main
      with:
        min-rating: ${{ inputs.min-rating }}
        provider: ${{ inputs.provider }}
        model: ${{ inputs.model }}
        api-key: ${{ inputs.api-key }}
        fallback-provider: ${{ inputs.fallback-provider }}
        fallback-model: ${{ inputs.fallback-model }}
        fallback-api-key: ${{ inputs.fallback-api-key }}
        virustotal-api-key: ""

    # ---------- Builds (gated per flag) ----------
    - name: Rust / Cargo release build
      if: contains(steps.meta.outputs.build_flags, 'cargo')
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        FLAGS="${{ steps.meta.outputs.build_flags }}"
        if echo ",$FLAGS," | grep -q ",cargo,"; then
          echo "::group::cargo build --release"
          cargo build --release --locked 2>/dev/null || cargo build --release
          echo "::endgroup::"
        fi

    - name: Python package (sdist + wheel)
      if: contains(steps.meta.outputs.build_flags, 'python')
      uses: YOUR_ORG/gha-workflows/.github/actions/python-build@main

    - name: Flutter APK + AAB + IPA
      if: contains(steps.meta.outputs.build_flags, 'flutter')
      uses: YOUR_ORG/gha-workflows/.github/actions/flutter-build@main

    - name: Android APK (native)
      if: contains(steps.meta.outputs.build_flags, 'android')
      uses: YOUR_ORG/gha-workflows/.github/actions/android-build@main

    - name: iOS unsigned IPA (native)
      if: contains(steps.meta.outputs.build_flags, 'ios')
      uses: YOUR_ORG/gha-workflows/.github/actions/ios-build@main

    - name: KMP Android build
      if: contains(steps.meta.outputs.build_flags, 'android') && contains(steps.lang.outputs.language, 'kmp')
      uses: YOUR_ORG/gha-workflows/.github/actions/kmp-android-build@main

    - name: Generate SHA256SUMS + manifest
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        set -euo pipefail
        mkdir -p dist
        # collect artifacts that exist
        for dir in target/release dist/release build/Release dist_signed/bin artifacts out; do
          [ -d "$dir" ] || continue
          find "$dir" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name '*.tar.gz' -o -name '*.whl' -o -name '*.zip' -o -name '*.nocache' \) 2>/dev/null -print0 | xargs -0 -r -I{} cp -n {} dist/ 2>/dev/null || true
        done
        if [ -z "$(find dist -type f | head -1)" ]; then
          echo "::warning::no artifacts found for checksums"
          exit 0
        fi
        (cd dist && sha256sum * > SHA256SUMS.txt 2>/dev/null || true)
        find dist -maxdepth 1 -type f | xargs -I{} basename {} > dist/manifest.txt
        # build release-manifest.json
        if command -v jq >/dev/null; then
          echo '{' > dist/release-manifest.json
          (cd dist && sha256sum *) | while read -r h f; do
            echo "  \"$f\": \"$h\"," >> dist/release-manifest.json
          done
          echo '}' >> dist/release-manifest.json
        fi
        echo "checksums:"
        (cd dist && cat SHA256SUMS.txt 2>/dev/null || true)
        VERSION="${{ steps.meta.outputs.version }}"
        echo "$VERSION\n$(date -u +%Y-%m-%d)" > dist/VERSION.txt

    - name: Generate release notes
      id: notes
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        OPENCODE_PKG: opencode-ai@${{ inputs.opencode-version }}
        PROV1: ${{ inputs.provider }}
        MODEL1: ${{ inputs.model }}
        KEY1: ${{ inputs.api-key }}
        PROV2: ${{ inputs.fallback-provider }}
        MODEL2: ${{ inputs.fallback-model }}
        KEY2: ${{ inputs.fallback-api-key }}
      run: |-
        set -uo pipefail
        mkdir -p reports
        NOTES="reports/release-notes-${RELEASE_TAG}.md"
        apply_key() {
          case "$1" in
            opencode)   export OPENCODE_API_KEY="$2" ;;
            google)     export GOOGLE_API_KEY="$2" ;;
            openai)     export OPENAI_API_KEY="$2" ;;
            mistral)    export MISTRAL_API_KEY="$2" ;;
            anthropic)  export ANTHROPIC_API_KEY="$2" ;;
            x|xai)      export XAI_API_KEY="$2" ;;
            deepseek)   export DEEPSEEK_API_KEY="$2" ;;
            groq)       export GROQ_API_KEY="$2" ;;
            puter)      export PUTER_AUTH_TOKEN="$2" ;;
            ollama)     : ;;
            *) echo "::warning::unknown provider '$1'";;
          esac
        }
        needs_key() { case "$1" in ollama|opencode|puter) return 1 ;; *) return 0 ;; esac; }
        full_model() { case "$2" in */*) echo "$2" ;; *) echo "$1/$2" ;; esac; }
        if [ -n "${{ inputs.release-notes-command }}" ]; then
          eval "${{ inputs.release-notes-command }}" > "$NOTES" 2>&1 || true
        else
          wrote=0
          for i in 1 2; do
            eval "p=\${PROV$i}"; eval "m=\${MODEL$i}"; eval "k=\${KEY$i}"
            [ -z "$p" ] && continue
            m=$(full_model "$p" "$m")
            if needs_key "$p" && [ -z "$k" ]; then
              echo "::warning::provider '$p' needs an API key - skipping $m for notes"
              continue
            fi
            apply_key "$p" "$k"
            echo "--- release notes via: $m (provider: $p) ---"
            if npx --yes "$OPENCODE_PKG" run --auto --model "$m" \
              "Write concise release notes for version ${RELEASE_NAME} from git history. Include categories: Features, Fixes, Breaking. Use bullets. No preamble." > "$NOTES" 2>&1; then
              wrote=1
              break
            fi
            echo "::warning::AI notes failed with $m, trying fallback"
          done
          [ "$wrote" -eq 0 ] && rm -f "$NOTES"
        fi
        if [ ! -s "$NOTES" ]; then
          echo "## $RELEASE_NAME" > "$NOTES"
          echo "" >> "$NOTES"
          git log --oneline "$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" 2>/dev/null >> "$NOTES" || \
            git log --oneline -20 >> "$NOTES" || true
          echo "(notes generated from git log — run with api-key for AI notes)" >> "$NOTES"
        fi
        echo "path=$NOTES" >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      uses: YOUR_ORG/gha-workflows/.github/actions/github-release@main
      with:
        github-token: ${{ inputs.github-token || github.token }}
        tag: ${{ steps.meta.outputs.release_tag }}
        body-file: ${{ steps.notes.outputs.path }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        assets: dist/*