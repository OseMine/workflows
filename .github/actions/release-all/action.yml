# Pin policy: use @v2 for stable (receives non-breaking fixes), @latest for
# rolling, @main only for testing.  All internal cross-references in this
# library are pinned to @v2 so a consumer pinning @v2 gets a consistent,
 # self-contained tree.  When you fork or copy a template, the pinned ref is
# the one thing you update when you want new behaviour.
name: Release
description: >-
  Unified release pipeline. Two modes:
  - full (default): version resolution -> builds -> security gate -> AI notes -> GitHub release with SHA256SUMS + manifest
  - simple: download artifacts / use local files -> create GitHub release (with optional AI/auto-generated notes)
author: gha-workflows

inputs:
  mode:
    description: "Pipeline mode. 'full' = builds + security + AI notes; 'simple' = artifacts + release only."
    required: false
    default: full
  language:
    description: "Main stack: auto, rust, tauri, node, python, flutter, kmp, php, lua. Comma-separated."
    required: false
    default: auto
  release-tag:
    description: "Version tag to use. Empty = auto-detect from pubspec.yaml / Cargo.toml / package.json."
    required: false
  draft:
    description: "Create the release as a draft."
    required: false
    default: "false"
  prerelease:
    description: "Mark as prerelease (default false, or auto from semver pre-release tags)."
    required: false
  github-token:
    description: "Token for creating the release. Defaults to github.token."
    required: false
  build:
    description: "Comma-separated artifact groups (cargo, tauri, plugin, installer, python, android, ios, flutter). 'all' = everything."
    required: false
    default: all
  min-rating:
    description: "Minimum security rating (0-10) required to release. 0 disables."
    required: false
    default: "7"
  security:
    description: "Run security gate before releasing."
    required: false
    default: "true"
  ios-scheme:
    description: "Xcode scheme name for native iOS build (forwarded to ios-build)."
    required: false
    default: ""
  provider:
    description: "Primary AI provider for notes + security (custom, opencode, google, openai, mistral, anthropic, x, deepseek, groq, puter, together, cerebras, openrouter, huggingface, lmstudio, ollama)."
    required: false
    default: opencode
  model:
    description: "Primary model. 'provider/model' or just the model id (provider input is prepended automatically). Special values: 'auto' (pick best available based on API keys), 'auto-free' (pick best free-tier model)."
    required: false
    default: auto-free
  api-key:
    description: "API key for primary provider."
    required: false
  fallback-provider:
    description: "Fallback AI provider."
    required: false
    default: opencode
  fallback-model:
    description: "Fallback model. Special values: 'auto', 'auto-free'."
    required: false
    default: auto-free
  fallback-api-key:
    description: "API key for fallback provider."
    required: false
  custom-api-base:
    description: "Base URL for the custom provider (OpenAI-compatible, e.g. https://api.example.com/v1). Required when provider=custom."
    required: false
  custom-api-key:
    description: "API key for the custom provider (defaults to api-key)."
    required: false
  custom-model:
    description: "Model id to use with the custom provider (overrides `model`)."
    required: false
  opencode-version:
    description: "opencode-ai npm version for AI release notes."
    required: false
    default: 1.18.29
  artifact-pattern:
    description: "Artifact names to download (leave empty to skip download)."
    required: false
    default: ""
  artifacts:
    description: "Glob pattern for local files to upload (e.g. 'dist/*')."
    required: false
    default: ""
  notes-file:
    description: "Path to pre-written release notes file."
    required: false
    default: ""
  generate-notes:
    description: "Use GitHub's auto-generated release notes."
    required: false
    default: "true"
  release-notes-command:
    description: "Custom command for release notes (disables AI + git-log). Env gets RELEASE_TAG/RELEASE_NAME."
    required: false
  version-file:
    description: "Path to a version file to consume when auto-detecting."
    required: false
  use-opencode:
    description: "Deprecated; use provider/model/api-key instead."
    required: false
    default: "false"
  opencode-api-key:
    description: "Deprecated alias for api-key."
    required: false
    default: ""
  opencode-model:
    description: "Deprecated alias for model."
    required: false
    default: ""
  notes-mode:
    description: >-
      How release notes are generated:
      auto  = AI first, fall back to notes-file then git-log.
      file  = use notes-file directly (skip AI).
      ai-required = AI only; fail the step if AI fails or output is invalid.
    required: false
    default: auto
  notes-provider:
    description: "AI provider override for release notes (defaults to `provider`)."
    required: false
  notes-model:
    description: "AI model override for release notes (defaults to `model`)."
    required: false
  notes-api-key:
    description: "API key override for release notes provider (defaults to `api-key`)."
    required: false
  notes-fallback-provider:
    description: "Fallback AI provider override for release notes (defaults to `fallback-provider`)."
    required: false
  notes-fallback-model:
    description: "Fallback AI model override for release notes (defaults to `fallback-model`)."
    required: false
  notes-fallback-api-key:
    description: "API key for release notes fallback provider (defaults to `fallback-api-key`)."
    required: false

runs:
  using: composite
  steps:
    - name: Resolve meta (version, build flags)
      id: meta
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        TAG: ${{ inputs.release-tag }}
        VERSION_FILE: ${{ inputs.version-file }}
        BUILD: ${{ inputs.build }}
      run: |-
        set -euo pipefail
        echo "::group::Meta resolution"
        VERSION=""
        RELEASE_TAG="$TAG"
        if [ -z "$RELEASE_TAG" ]; then
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            RELEASE_TAG="v${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "v" ]; then
            for f in "${VERSION_FILE:-}" pubspec.yaml Cargo.toml package.json; do
              [ -f "$f" ] || continue
              case "$f" in
                pubspec.yaml) VERSION=$(grep -m1 '^version:' "$f" | awk '{print $2}' | tr -d "'\"") ;;
                Cargo.toml)   VERSION=$(grep -m1 '^version' "$f" | sed -E 's/^version\s*=\s*"([^"]+)"/\1/') ;;
                package.json) VERSION=$(grep -m1 '"version"' "$f" | sed -E 's/.*"version"\s*:\s*"([^"]+)".*/\1/') ;;
                pyproject.toml) VERSION=$(grep -m1 '^version' "$f" | sed -E 's/^version\s*=\s*"?("?)[^"]*"?\s*$/\1/') ;;
              esac
              [ -n "$VERSION" ] && break
            done
            RELEASE_TAG="v${VERSION}"
          fi
        fi
        SEMVER="${RELEASE_TAG#v}"
        if [[ "$SEMVER" =~ ^v[0-9] ]]; then SEMVER="${SEMVER#v}"; fi
        if ! [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "::error::Invalid semver tag '$RELEASE_TAG' (expected vX.Y.Z)"
          exit 1
        fi
        RELEASE_NAME="Release $SEMVER"
        VERSION="$SEMVER"

        if [ -n "$GITHUB_REF" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TRIGGERED_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TRIGGERED_TAG" != "$RELEASE_TAG" ]; then
            echo "::warning::triggered tag '$TRIGGERED_TAG' differs from detected version '$RELEASE_TAG'"
          fi
        fi

        FLAGS=""
        REQUESTED="$BUILD"
        [ -z "$REQUESTED" ] && REQUESTED="all"
        [ "$REQUESTED" = "all" ] && { REQUESTED="cargo,tauri,plugin,installer,python,android,ios,flutter,c,cpp,csharp,java"; }
        IFS=',' read -ra arr <<< "$REQUESTED"
        for b in "${arr[@]}"; do
          case "$b" in
            all)                CONTINUE=1 ;;
            cargo)              FLAGS="${FLAGS},cargo" ;;
            tauri)              FLAGS="${FLAGS},tauri" ;;
            plugin|vst|clap)    FLAGS="${FLAGS},plugin" ;;
            installer|innosetup) FLAGS="${FLAGS},installer" ;;
            python|pyinstaller) FLAGS="${FLAGS},python" ;;
            android|apk)        FLAGS="${FLAGS},android" ;;
            ios|ipa)            FLAGS="${FLAGS},ios" ;;
            flutter)            FLAGS="${FLAGS},flutter" ;;
            c)                  FLAGS="${FLAGS},c" ;;
            cpp|c\+\+|cc)       FLAGS="${FLAGS},cpp" ;;
            csharp|dotnet|cs)   FLAGS="${FLAGS},csharp" ;;
            java|maven|gradle)  FLAGS="${FLAGS},java" ;;
            *) echo "::warning::unknown build flag '$b'" ;;
          esac
        done
        FLAGS="${FLAGS#,}"

        LANG="${{ inputs.language }}"
        [ -z "$LANG" ] || [ "$LANG" = "auto" ] && LANG="rust,node,python,flutter,kmp,php,lua,tauri,c,cpp,csharp,java"
        PRUNED=""
        IFS=',' read -ra la <<< "$LANG"
        for flag in cargo tauri plugin installer python android ios flutter c cpp csharp java; do
          echo ",$FLAGS," | grep -q ",$flag," || continue
          echo ",$PRUNED," | grep -q ",$flag," && continue
          PRUNED="${PRUNED},$flag"
        done
        echo "build_flags=${FLAGS}" >> "$GITHUB_OUTPUT"
        echo "language=$LANG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"
        echo "meta: tag=$RELEASE_TAG name=$RELEASE_NAME flags=$FLAGS"

    - name: Resolve language (auto-detect if not given)
      if: ${{ inputs.mode == 'full' }}
      id: lang
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        LANG: ${{ inputs.language }}
      run: |-
        set -euo pipefail
        if [ -z "$LANG" ] || [ "$LANG" = "auto" ]; then
          LANG=""
          [ -f Cargo.toml ] && LANG="${LANG},rust"
          [ -d src-tauri ] && [ -f Cargo.toml ] && LANG="tauri"
          [ -f pubspec.yaml ] && LANG="${LANG},flutter"
          [ -f package.json ] && LANG="${LANG},node"
          { [ -f pyproject.toml ] || [ -f setup.py ]; } && LANG="${LANG},python"
          if [ -f pom.xml ]; then LANG="${LANG},maven"
          elif [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f settings.gradle ]; then LANG="${LANG},gradle"
          fi
          { [ -f Makefile ] || [ -f CMakeLists.txt ]; } && { ls *.c >/dev/null 2>&1 || ls *.cpp *.cc *.cxx >/dev/null 2>&1; } && LANG="${LANG},c-cpp"
          ls *.cs >/dev/null 2>&1 && LANG="${LANG},csharp"
          LANG="${LANG#,}"
          [ -z "$LANG" ] && LANG="none"
        fi
        echo "language=$LANG" >> "$GITHUB_OUTPUT"

    - name: Preflight - resolved config
      if: inputs.mode == 'full'
      shell: bash
      env:
        NOTES_MODE: ${{ inputs.notes-mode }}
        NOTES_FILE: ${{ inputs.notes-file }}
        NOTES_PROV: ${{ inputs.notes-provider }}
        SEC_PROV: ${{ inputs.provider }}
        NOTES_KEY_SET: ${{ inputs.notes-api-key != '' && 'yes' || 'no' }}
        SEC_KEY_SET: ${{ inputs.api-key != '' && 'yes' || (inputs.opencode-api-key != '' && 'yes' || 'no') }}
      run: |-
        echo "::group::Resolved release config"
        echo "mode:          ${{ inputs.mode }}"
        echo "language:      ${{ steps.meta.outputs.language }}"
        echo "build_flags:   ${{ steps.meta.outputs.build_flags }}"
        echo "version:       ${{ steps.meta.outputs.version }} (tag ${{ steps.meta.outputs.release_tag }})"
        echo "security:      ${{ inputs.security }} (min-rating ${{ inputs.min-rating }})"
        echo "sec  provider: $SEC_PROV  key_set=$SEC_KEY_SET"
        echo "notes_mode:    $NOTES_MODE"
        echo "notes_file:    ${NOTES_FILE:-<none>}"
        echo "notes_provider:${NOTES_PROV:-<inherits from sec provider>}"
        echo "notes_key_set: $NOTES_KEY_SET"
        echo "draft:         ${{ inputs.draft }}"
        echo "prerelease:    ${{ inputs.prerelease }}"
        echo "generate_notes:${{ inputs.generate-notes }}"
        echo "::endgroup::"

    - name: Run security gate
      if: ${{ inputs.mode == 'full' && inputs.security == 'true' }}
      uses: OseMine/workflows/.github/actions/security@v2
      with:
        min-rating: ${{ inputs.min-rating }}
        provider: ${{ inputs.provider }}
        model: ${{ inputs.model }}
        api-key: ${{ inputs.api-key }}
        fallback-provider: ${{ inputs.fallback-provider }}
        fallback-model: ${{ inputs.fallback-model }}
        fallback-api-key: ${{ inputs.fallback-api-key }}
        custom-api-base: ${{ inputs.custom-api-base }}
        custom-api-key: ${{ inputs.custom-api-key }}
        custom-model: ${{ inputs.custom-model }}
        virustotal-api-key: ""

    - name: Rust / Cargo release build
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'cargo') }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        FLAGS="${{ steps.meta.outputs.build_flags }}"
        if echo ",$FLAGS," | grep -q ",cargo,"; then
          echo "::group::cargo build --release"
          cargo build --release --locked 2>/dev/null || cargo build --release
          echo "::endgroup::"
        fi

    - name: Python package (sdist + wheel)
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'python') }}
      uses: OseMine/workflows/.github/actions/python-build@v2

    - name: Flutter APK + AAB + IPA
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'flutter') }}
      uses: OseMine/workflows/.github/actions/flutter-build@v2

    - name: Android APK (native)
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'android') }}
      uses: OseMine/workflows/.github/actions/android-build@v2

    - name: iOS unsigned IPA (native)
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'ios') && inputs.ios-scheme != '' }}
      uses: OseMine/workflows/.github/actions/ios-build@v2
      with:
        scheme: ${{ inputs.ios-scheme }}

    - name: KMP Android build
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'android') && contains(steps.lang.outputs.language, 'kmp') }}
      uses: OseMine/workflows/.github/actions/kmp-android-build@v2

    - name: Tauri desktop app build
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'tauri') }}
      uses: OseMine/workflows/.github/actions/tauri-build@v2

    - name: C build
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'c') && contains(steps.lang.outputs.language, 'c-cpp') }}
      uses: OseMine/workflows/.github/actions/c-build@v2

    - name: C++ build
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'cpp') && contains(steps.lang.outputs.language, 'c-cpp') }}
      uses: OseMine/workflows/.github/actions/cpp-build@v2

    - name: C# / .NET build
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'csharp') && contains(steps.lang.outputs.language, 'csharp') }}
      uses: OseMine/workflows/.github/actions/csharp-build@v2

    - name: Java build (Maven)
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'java') && contains(steps.lang.outputs.language, 'maven') }}
      uses: OseMine/workflows/.github/actions/java-maven-build@v2

    - name: Java build (Gradle)
      if: ${{ inputs.mode == 'full' && contains(steps.meta.outputs.build_flags, 'java') && contains(steps.lang.outputs.language, 'gradle') }}
      uses: OseMine/workflows/.github/actions/java-gradle-build@v2

    - name: Collect artifacts
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        set -euo pipefail
        mkdir -p dist

        if [ -n "${{ inputs.artifact-pattern }}" ]; then
          echo "::group::Download artifacts"
          echo "Artifact pattern provided: ${{ inputs.artifact-pattern }}"
          echo "::endgroup::"
        fi

        if [ "${{ inputs.mode }}" = "full" ]; then
          for dir in target/release dist/release dist build/Release dist_signed/bin artifacts out; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.apk' -o -name '*.aab' -o -name '*.ipa' -o -name '*.tar.gz' -o -name '*.whl' -o -name '*.zip' -o -name '*.nocache' -o -name '*.jar' -o -name '*.war' -o -name '*.aar' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' -o -name '*.bin' -o -name '*.AppImage' \) 2>/dev/null -print0 | xargs -0 -r -I{} cp -n {} dist/ 2>/dev/null || true
          done
        else
          if [ -n "${{ inputs.artifacts }}" ]; then
            echo "Collecting local artifacts: ${{ inputs.artifacts }}"
            find . -name "${{ inputs.artifacts }}" -type f -exec cp -n {} dist/ \; 2>/dev/null || true
          fi
        fi

    - name: Download workflow artifacts
      if: ${{ inputs.mode == 'simple' && inputs.artifact-pattern != '' }}
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: artifacts
        merge-multiple: true

    - name: Merge downloaded artifacts into dist
      if: ${{ inputs.mode == 'simple' && inputs.artifact-pattern != '' }}
      shell: bash
      run: |
        if [ -d "artifacts" ]; then
          cp -n artifacts/* dist/ 2>/dev/null || true
        fi

    - name: Generate SHA256SUMS + manifest
      if: ${{ inputs.mode == 'full' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        set -euo pipefail
        if [ -z "$(find dist -type f | head -1)" ]; then
          echo "::warning::no artifacts found for checksums"
          exit 0
        fi
        (cd dist && sha256sum * > SHA256SUMS.txt 2>/dev/null || true)
        find dist -maxdepth 1 -type f | xargs -I{} basename {} > dist/manifest.txt
        if command -v jq >/dev/null; then
          echo '{' > dist/release-manifest.json
          (cd dist && sha256sum *) | while read -r h f; do
            echo "  \"$f\": \"$h\"," >> dist/release-manifest.json
          done
          echo '}' >> dist/release-manifest.json
        fi
        echo "checksums:"
        (cd dist && cat SHA256SUMS.txt 2>/dev/null || true)
        VERSION="${{ steps.meta.outputs.version }}"
        echo "$VERSION\n$(date -u +%Y-%m-%d)" > dist/VERSION.txt

    - name: Generate release notes
      id: notes
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        OPENCODE_PKG: opencode-ai@${{ inputs.opencode-version }}
        NOTES_MODE: ${{ inputs.notes-mode || 'auto' }}
        NOTES_FILE: ${{ inputs.notes-file }}
        RELEASE_NOTES_CMD: ${{ inputs.release-notes-command }}
        # Per-purpose provider overrides: notes-provider falls back to sec provider
        PROV1: ${{ inputs.notes-provider != '' && inputs.notes-provider || inputs.provider }}
        MODEL1: ${{ inputs.notes-model != '' && inputs.notes-model || inputs.model }}
        KEY1: ${{ inputs.notes-api-key != '' && inputs.notes-api-key || (inputs.api-key != '' && inputs.api-key || inputs.opencode-api-key) }}
        PROV2: ${{ inputs.notes-fallback-provider != '' && inputs.notes-fallback-provider || inputs.fallback-provider }}
        MODEL2: ${{ inputs.notes-fallback-model != '' && inputs.notes-fallback-model || inputs.fallback-model }}
        KEY2: ${{ inputs.notes-fallback-api-key != '' && inputs.notes-fallback-api-key || inputs.fallback-api-key }}
        CUSTOM_BASE: ${{ inputs.custom-api-base }}
        CUSTOM_KEY: ${{ inputs.custom-api-key }}
        CUSTOM_MODEL: ${{ inputs.custom-model }}
      run: |-
        set -uo pipefail
        source "${{ github.action_path }}/../lib-ai/ai.bash"

        mkdir -p reports
        NOTES="reports/release-notes-${RELEASE_TAG}.md"

        # -- file-only mode -------------------------------------------
        if [ "$NOTES_MODE" = "file" ]; then
          if [ -z "$NOTES_FILE" ] || [ ! -f "$NOTES_FILE" ]; then
            echo "::error::notes-mode=file but notes-file '$NOTES_FILE' not found or empty"
            exit 1
          fi
          cp "$NOTES_FILE" "$NOTES"
          echo "Using pre-written notes from $NOTES_FILE"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # -- custom command (bypasses AI entirely) ---------------------
        if [ -n "$RELEASE_NOTES_CMD" ]; then
          eval "$RELEASE_NOTES_CMD" > "$NOTES" 2>&1 || true
          if [ -s "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::release-notes-command produced empty output"
        fi

        # -- AI notes -------------------------------------------------
        run_notes() {
          local m="$1"
          echo "--- release notes via: $m ---"
          local tmp logf prompt ok=0
          tmp=$(mktemp)
          logf=$(mktemp)
          prompt="Write concise release notes for version ${RELEASE_NAME} from git history. Include categories: Features, Fixes, Breaking. Use bullets. No preamble."
          # Attempt 1: --format json emits NDJSON events; --print-logs keeps the
          # TUI/log noise on stderr so stdout has none.  Extract assistant text.
          if npx --yes "$OPENCODE_PKG" run --format json --print-logs --auto --model "$m" \
              "$prompt" 2>"$logf" | ai_extract_text > "$tmp" \
              && ai_sanitize_ai_output < "$tmp" > "$NOTES" \
              && ai_is_valid_notes "$NOTES"; then
            ok=1
          fi
          # Attempt 2 (JSON path unusable / older opencode): plain stdout capture.
          if [ "$ok" -eq 0 ]; then
            rm -f "$NOTES"
            echo "::debug::JSON notes extraction unusable, retrying in plain text mode"
            npx --yes "$OPENCODE_PKG" run --print-logs --auto --model "$m" \
                "$prompt" 2>"$logf" > "$tmp" || {
              echo "::warning::opencode invocation failed for $m (see log below)"
              cat "$logf" >&2 || true
              rm -f "$tmp" "$logf"
              return 1
            }
            ai_sanitize_ai_output < "$tmp" > "$NOTES" \
              && ai_is_valid_notes "$NOTES"
          fi
          rm -f "$tmp" "$logf"
          if [ "$ok" -eq 0 ]; then
            echo "::warning::AI notes output invalid (garbage or insufficient content) from $m"
            rm -f "$NOTES"
            return 1
          fi
          return 0
        }

        ai_ok=0
        FREE1=0; [ "$MODEL1" = "auto-free" ] && FREE1=1
        RESOLVED_MODEL1=$(ai_resolve "$MODEL1" "$PROV1" "$KEY1" "$PROV2" "$MODEL2" "$KEY2")
        FULL1=$(ai_prepare "$RESOLVED_MODEL1" "$KEY1" "$FREE1") || FULL1=""
        if [ -n "$FULL1" ] && run_notes "$FULL1"; then
          ai_ok=1
        else
          echo "::warning::AI notes failed with $FULL1, trying fallback"
          FREE2=0; [ "$MODEL2" = "auto-free" ] && FREE2=1
          RESOLVED_MODEL2=$(ai_resolve "$MODEL2" "$PROV2" "$KEY2" "" "" "")
          FULL2=$(ai_prepare "$RESOLVED_MODEL2" "$KEY2" "$FREE2") || FULL2=""
          if [ -n "$FULL2" ] && run_notes "$FULL2"; then
            ai_ok=1
          else
            echo "::warning::all AI notes providers failed"
          fi
        fi

        if [ "$ai_ok" -eq 1 ]; then
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # -- AI failed ------------------------------------------------
        if [ "$NOTES_MODE" = "ai-required" ]; then
          echo "::error::AI release notes failed (mode=ai-required). Configure provider+api-key, or switch notes-mode to 'auto'."
          exit 1
        fi

        # -- notes-file fallback (auto mode) --------------------------
        if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
          cp "$NOTES_FILE" "$NOTES"
          echo "AI notes failed, using pre-written notes from $NOTES_FILE"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # -- git-log fallback -----------------------------------------
        echo "## $RELEASE_NAME" > "$NOTES"
        echo "" >> "$NOTES"
        git log --oneline "$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" 2>/dev/null >> "$NOTES" || \
          git log --oneline -20 >> "$NOTES" || true
        echo "(notes generated from git log -- run with api-key for AI notes)" >> "$NOTES"
        echo "path=$NOTES" >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      uses: OseMine/workflows/.github/actions/github-release@v2
      with:
        github-token: ${{ inputs.github-token || github.token }}
        tag: ${{ steps.meta.outputs.release_tag }}
        body-file: ${{ steps.notes.outputs.path }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        assets: dist/*