name: Setup Flutter
description: Install a Flutter SDK with dependency caching and optional native-build cache.

inputs:
  flutter-version:
    description: Flutter SDK version (e.g. "3.47.0")
    required: false
    default: ""
  channel:
    description: Flutter channel (stable, beta, dev)
    required: false
    default: "stable"
  cache-deps:
    description: Cache pub dependencies (true/false)
    required: false
    default: "true"
  native-cache-name:
    description: Cache key suffix for a native build cache dir (e.g. "linux"). Empty to skip.
    required: false
    default: ""
  native-cache-path:
    description: Path to the native build cache (used with native-cache-name)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: ${{ inputs.cache-deps }}

    - name: Cache native builds
      if: inputs.native-cache-name != ''
      uses: actions/cache@v6
      with:
        path: ${{ inputs.native-cache-path }}
        key: ${{ runner.os }}-${{ inputs.native-cache-name }}-${{ hashFiles('pubspec.lock') }}

    - name: Install Dependencies
      shell: bash
      run: flutter pub get