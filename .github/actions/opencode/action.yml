name: Run OpenCode (AI automation)
description: >-
  Runs opencode-ai with a prompt inside the checked-out repository using a
  primary provider+model and a fallback provider+model (API keys per provider).
  Sets git identity, runs the first model that works, and summarizes. Projects
  call this from a thin workflow so the AI logic can be updated centrally.
author: gha-workflows

inputs:
  prompt:
    description: >-
      Prompt/task to run (project-specific text). Use prompt-file instead when
      the prompt needs runtime content (git diff, real issues, etc.).
    required: false
    default: ""
  prompt-file:
    description: >-
      Path (absolute or relative to working-directory) to a file containing the
      prompt. Prefers prompt-file over prompt when both are set.
    required: false
    default: ""
  agent:
    description: opencode agent to use.
    required: false
    default: build
  provider:
    description: >-
      Primary AI provider: custom, opencode, google, openai, mistral, anthropic,
      x, deepseek, groq, puter, together, cerebras, openrouter, huggingface,
      lmstudio (local, no key needed), ollama (local, no key needed).
    required: false
    default: opencode
  model:
    description: "Primary model. 'provider/model' or just the model id (provider input is prepended automatically). Special values: 'auto' (pick best available based on API keys), 'auto-free' (pick best free-tier model)."
    required: false
    default: auto-free
  api-key:
    description: API key for the primary provider (empty = anonymous/local model if possible).
    required: false
  fallback-provider:
    description: Fallback AI provider (same list as `provider`).
    required: false
    default: opencode
  fallback-model:
    description: "Fallback model (same format as model). Special values: 'auto', 'auto-free'."
    required: false
    default: auto-free
  fallback-api-key:
    description: API key for the fallback provider (empty = omitted).
    required: false
  custom-api-base:
    description: "Base URL for the custom provider (OpenAI-compatible, e.g. https://api.example.com/v1). Required when provider=custom."
    required: false
  custom-api-key:
    description: "API key for the custom provider (defaults to api-key)."
    required: false
  custom-model:
    description: "Model id to use with the custom provider (overrides `model`)."
    required: false
  opencode-version:
    description: Version of the opencode-ai npm package to use.
    required: false
    default: 1.18.29
  working-directory:
    description: Directory to run in (relative to the workspace).
    required: false
    default: .
  git-identity:
    description: Commit identity, as 'Name <email>'.
    required: false
    default: GitHub Actions <github-actions[bot]@users.noreply.github.com>
  timeout-minutes:
    description: Hard timeout for the run.
    required: false
    default: "45"

runs:
  using: composite
  steps:
    - name: Configure git identity
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        IFS='<' read -r name email <<< "${{ inputs.git-identity }}"
        email="${email%>}"
        git config --global user.name "${name% }"
        git config --global user.email "${email% }"
        git config --global safe.directory '*'

    - name: Run OpenCode with provider-aware fallback
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        OPENCODE_ENV: github-actions
        GITHUB_TOKEN: ${{ github.token }}
        PACKAGE: opencode-ai@${{ inputs.opencode-version }}
        PROV1: ${{ inputs.provider }}
        MODEL1: ${{ inputs.model }}
        KEY1: ${{ inputs.api-key }}
        PROV2: ${{ inputs.fallback-provider }}
        MODEL2: ${{ inputs.fallback-model }}
        KEY2: ${{ inputs.fallback-api-key }}
        CUSTOM_BASE: ${{ inputs.custom-api-base }}
        CUSTOM_KEY: ${{ inputs.custom-api-key }}
        CUSTOM_MODEL: ${{ inputs.custom-model }}
        AGENT: ${{ inputs.agent }}
        PROMPT: ${{ inputs.prompt }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        TIMEOUT_MIN: ${{ inputs.timeout-minutes }}
      run: |-
        set -uo pipefail
        source "${{ github.action_path }}/../lib-ai/ai.bash"
        # prefer prompt-file (may contain runtime data) over inline prompt
        if [ -n "$PROMPT_FILE" ] && [ -f "$PROMPT_FILE" ]; then
          PROMPT=$(cat "$PROMPT_FILE")
        fi
        if [ -z "${PROMPT:-}" ]; then
          echo "::error::no prompt given (set 'prompt' or 'prompt-file')"
          exit 1
        fi
        ai_try() {
          local m="$1"
          echo "--- trying model: $m ---"
          local cmd=(npx --yes "$PACKAGE" run --model "$m")
          [ -n "$AGENT" ] && cmd+=(--agent "$AGENT")
          cmd+=(--auto "$PROMPT")
          if [ -n "$TIMEOUT_MIN" ] && command -v timeout >/dev/null 2>&1; then
            timeout "${TIMEOUT_MIN}m" "${cmd[@]}"
          else
            "${cmd[@]}"
          fi
        }
        # resolve primary model (provider alias or provider/model)
        FREE1=0; [ "$MODEL1" = "auto-free" ] && FREE1=1
        RESOLVED_MODEL1=$(ai_resolve "$MODEL1" "$PROV1" "$KEY1" "$PROV2" "$MODEL2" "$KEY2")
        FULL1=$(ai_prepare "$RESOLVED_MODEL1" "$KEY1" "$FREE1") || FULL1=""
        if [ -n "$FULL1" ] && ai_try "$FULL1"; then
          echo "AI task succeeded with model: $FULL1" >> "$GITHUB_STEP_SUMMARY"
        else
          # resolve + try fallback model
          FREE2=0; [ "$MODEL2" = "auto-free" ] && FREE2=1
          RESOLVED_MODEL2=$(ai_resolve "$MODEL2" "$PROV2" "$KEY2" "" "" "")
          FULL2=$(ai_prepare "$RESOLVED_MODEL2" "$KEY2" "$FREE2") || FULL2=""
          if [ -n "$FULL2" ] && ai_try "$FULL2"; then
            echo "AI task succeeded with model: $FULL2 (fallback)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::all AI providers failed for this task"
            exit 1
          fi
        fi

    - name: Summarize result
      if: ${{ always() }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |-
        printf '## OpenCode run finished\n' >> "$GITHUB_STEP_SUMMARY"
        printf -- '- Provider: %s / model: %s\n' "${{ inputs.provider }}" "${{ inputs.model }}" >> "$GITHUB_STEP_SUMMARY"
        printf -- '- Agent: %s\n' "${{ inputs.agent }}" >> "$GITHUB_STEP_SUMMARY"
        printf -- '- Path: %s\n' "${{ inputs.working-directory }}" >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ steps.run.outcome }}" != "success" ]; then
          printf -- '- Status: **failed** (see logs)\n' >> "$GITHUB_STEP_SUMMARY"
        fi