name: Build Windows installer
description: >-
  Builds a Windows installer (Inno Setup) from bundled plugins.
  Reads version from Cargo.toml. Only runs on Windows runners.

inputs:
  app-name:
    description: "Application name for the installer"
    required: true
  bundles-dir:
    description: "Directory containing plugin bundles"
    required: false
    default: "target/bundled"
  artifact:
    description: "Artifact name for the uploaded installer"
    required: false
    default: "installer"

runs:
  using: composite
  steps:
    - name: Install Inno Setup
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install innosetup -y --no-progress

    - name: Generate installer script
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = (Get-Location).Path
        $bundles = Join-Path $root '${{ inputs.bundles-dir }}'
        if (-not (Test-Path $bundles)) {
          throw "no bundles found under $bundles"
        }

        $match = Select-String -Path (Join-Path $root 'Cargo.toml') `
          -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
        $version = $match.Matches[0].Groups[1].Value

        $out = Join-Path $root 'target/installer'
        New-Item -ItemType Directory -Force -Path $out | Out-Null

        $lines = [System.Collections.Generic.List[string]]::new()
        $lines.Add('; generated by .github/actions/installer')
        $lines.Add('[Setup]')
        $lines.Add('AppName=${{ inputs.app-name }}')
        $lines.Add('AppVersion=' + $version)
        $lines.Add('AppPublisher=${{ inputs.app-name }}')
        $lines.Add('DefaultDirName={autopf64}\${{ inputs.app-name }}')
        $lines.Add('DisableProgramGroupPage=yes')
        $lines.Add('OutputDir=' + $out)
        $lines.Add('OutputBaseFilename=${{ inputs.app-name }}-Installer-' + $version)
        $lines.Add('Compression=lzma2/max')
        $lines.Add('SolidCompression=yes')
        $lines.Add('ArchitecturesAllowed=x64compatible')
        $lines.Add('ArchitecturesInstallIn64BitMode=x64compatible')
        $lines.Add('UninstallDisplayName=${{ inputs.app-name }}')
        $lines.Add('')
        $lines.Add('[Files]')

        Get-ChildItem -Directory $bundles | ForEach-Object {
          $name = $_.Name
          $path = Join-Path $_.FullName '*'
          if ($name.EndsWith('.vst3')) {
            $lines.Add('Source: "' + $path + '"; DestDir: "{commoncf64}\VST3\' + $name + '"; Flags: recursesubdirs createallsubdirs ignoreversion')
          } elseif ($name.EndsWith('.clap')) {
            $lines.Add('Source: "' + $path + '"; DestDir: "{commoncf64}\CLAP\' + $name + '"; Flags: recursesubdirs createallsubdirs ignoreversion')
          } else {
            $lines.Add('Source: "' + $path + '"; DestDir: "{app}\' + $name + '"; Flags: recursesubdirs createallsubdirs ignoreversion')
          }
        }

        $iss = Join-Path $out 'installer.iss'
        [System.IO.File]::WriteAllLines($iss, $lines)

    - name: Compile installer (ISCC)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
        if (-not (Test-Path $iscc)) {
          $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' |
            Select-Object -First 1).FullName
        }
        if (-not $iscc) { throw 'ISCC.exe not found' }
        $iss = Join-Path (Get-Location).Path 'target/installer/installer.iss'
        & $iscc $iss /Qp
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

    - name: Upload installer
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}-${{ runner.os }}
        path: target/installer/*.exe
        if-no-files-found: error
