name: Build Android APK
description: >-
  Set up JDK + Gradle, optionally sign, build and upload an APK.
  Works on ubuntu-24.04 which ships Android SDK pre-installed.

inputs:
  signed:
    description: "Build a signed release APK (true) or unsigned debug APK (false)"
    required: false
    default: "false"
  keystore:
    description: "Base64-encoded JKS keystore (required when signed=true)"
    required: false
    default: ""
  keystore-store-password:
    description: "Keystore password"
    required: false
    default: ""
  keystore-key-alias:
    description: "Key alias"
    required: false
    default: ""
  keystore-key-password:
    description: "Key password"
    required: false
    default: ""
  artifact-name:
    description: "Name for the uploaded artifact"
    required: false
    default: "android"
  android-dir:
    description: "Path to the Android project directory"
    required: false
    default: "android"

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-home-cache-cleanup: true

    - name: Decode keystore
      if: inputs.signed == 'true' && inputs.keystore != ''
      shell: bash
      run: echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
      env:
        KEYSTORE_B64: ${{ inputs.keystore }}

    - name: Build APK
      shell: bash
      working-directory: ${{ inputs.android-dir }}
      env:
        KEYSTORE_PATH: ${{ inputs.signed == 'true' && inputs.keystore != '' && '/tmp/release.jks' || '' }}
        KEYSTORE_STORE_PASSWORD: ${{ inputs.keystore-store-password }}
        KEYSTORE_KEY_ALIAS: ${{ inputs.keystore-key-alias }}
        KEYSTORE_KEY_PASSWORD: ${{ inputs.keystore-key-password }}
      run: |
        chmod +x gradlew
        if [ "${{ inputs.signed }}" = "true" ]; then
          ./gradlew :app:assembleRelease --console=plain
        else
          ./gradlew :app:assembleDebug --console=plain
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.android-dir }}/app/build/outputs/apk/${{ inputs.signed == 'true' && 'release' || 'debug' }}/*.apk
        if-no-files-found: error
        retention-days: 14
