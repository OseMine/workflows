name: Publish to PyPI
description: "Publish built distributions to PyPI using trusted publishing (OIDC). Requires `permissions: id-token: write` and a PyPI trusted publisher configured for this repository and the calling workflow."
# The pypa/gh-action-pypi-publish action cannot be used here because it runs
# inside a Docker container whose image name is derived from
# `github.repository`, and a mixed-case org is not a valid lowercase Docker
# reference. Publishing is done imperatively with twine using the same OIDC
# token flow.

inputs:
  working-directory:
    description: Directory that contains the built dist/ folder (relative to repo root)
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Publish to PyPI via trusted publishing
      shell: bash
      run: |
        set -euo pipefail

        # -- preflight: actionable diagnostics when OIDC is misconfigured --
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::OIDC token env vars missing. Add 'permissions: id-token: write' to the calling workflow, and ensure the job runs on a GitHub-hosted runner (not self-hosted)."
          echo "  ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+<set>}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-<empty>}"
          echo "  ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+<set>}${ACTIONS_ID_TOKEN_REQUEST_URL:-<empty>}"
          echo "  Hint: also verify a PyPI trusted publisher is configured for $GITHUB_REPOSITORY workflow '$GITHUB_WORKFLOW'."
          exit 1
        fi
        echo "::debug::OIDC env OK - requesting token from GitHub..."

        OIDC_RESP=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi")
        OIDC_TOKEN=$(printf '%s' "${OIDC_RESP}" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

        MINT_FILE="$(mktemp)"
        MINT_STATUS=$(curl -s -o "${MINT_FILE}" -w "%{http_code}" \
          -X POST -H "Content-Type: application/json" \
          https://pypi.org/_/oidc/mint-token \
          -d "{\"token\":\"${OIDC_TOKEN}\"}")
        echo "PyPI mint-token status: ${MINT_STATUS}"
        if [ "${MINT_STATUS}" != "200" ]; then
          echo "PyPI could not mint a token. Is the trusted publisher configured" >&2
          echo "for $GITHUB_REPOSITORY and workflow '$GITHUB_WORKFLOW'?" >&2
          cat "${MINT_FILE}" >&2
          rm -f "${MINT_FILE}"
          exit 1
        fi
        PYPI_TOKEN=$(python3 -c "import json; print(json.load(open('${MINT_FILE}'))['token'])")
        rm -f "${MINT_FILE}"

        # -- preflight: make sure dist/ has something to upload ----------
        if ! compgen -G "${{ inputs.working-directory }}"/dist/* >/dev/null; then
          echo "::error::no distributions found at '${{ inputs.working-directory }}/dist/*'. Did a prior build step run? Run the build (mode: full) before publishing, or set working-directory to the folder containing dist/."
          exit 1
        fi

        python3 -m pip install --quiet twine
        TWINE_USERNAME=__token__ TWINE_PASSWORD="${PYPI_TOKEN}" \
          python3 -m twine upload --non-interactive "${{ inputs.working-directory }}"/dist/*