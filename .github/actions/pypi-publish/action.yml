name: Publish to PyPI
description: "Publish built distributions to PyPI using trusted publishing (OIDC). Requires `permissions: id-token: write` on the calling job and a PyPI trusted publisher configured for this repository and workflow. Set repository-url to publish to TestPyPI."
# The pypa/gh-action-pypi-publish action cannot be used here because it runs
# inside a Docker container whose image name is derived from
# `github.repository`, and a mixed-case org is not a valid lowercase Docker
# reference. Publishing is done imperatively with twine using the same OIDC
# token flow.

inputs:
  working-directory:
    description: Directory that contains the built dist/ folder (relative to repo root)
    required: false
    default: "."
  repository-url:
    description: PyPI upload URL (default is production PyPI; use https://test.pypi.org/legacy/ for TestPyPI)
    required: false
    default: "https://upload.pypi.org/legacy/"
  skip-existing:
    description: If true, pass --skip-existing to twine so reruns with an already-published version do not fail
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Publish to PyPI via trusted publishing
      shell: bash
      env:
        WD: ${{ inputs.working-directory }}
        PYPI_URL: ${{ inputs.repository-url }}
        SKIP_EXISTING: ${{ inputs.skip-existing }}
      run: |
        set -euo pipefail

        # -- preflight 1: OIDC env vars present ----------------------------
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::OIDC token env vars missing. Add 'permissions: id-token: write' to the JOB that calls this action (not this action file), and run on a GitHub-hosted runner (the OIDC endpoint is not reachable from self-hosted runners)."
          echo "  env ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+<set>}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-<empty>}"
          echo "  env ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+<set>}${ACTIONS_ID_TOKEN_REQUEST_URL:-<empty>}"
          exit 1
        fi

        # -- preflight 2: fetch GitHub OIDC JWT ----------------------------
        OIDC_FILE="$(mktemp)"
        OIDC_CODE=$(curl -s -o "$OIDC_FILE" -w "%{http_code}" \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi") || OIDC_CODE="000"
        if [ "$OIDC_CODE" != "200" ]; then
          echo "::error::GitHub OIDC token request failed (HTTP $OIDC_CODE)."
          cat "$OIDC_FILE" >&2 || true
          echo "  Hint: ensure the job has 'permissions: id-token: write' so the pypi audience is allowed."
          rm -f "$OIDC_FILE"
          exit 1
        fi
        OIDC_TOKEN=$(python3 -c "import json; print(json.load(open('${OIDC_FILE}'))['value'])")
        rm -f "$OIDC_FILE"
        [ -n "$OIDC_TOKEN" ] || { echo "::error::empty OIDC token returned by GitHub."; exit 1; }
        echo "::debug::OIDC JWT fetched (audience=pypi)"

        # -- preflight 3: mint PyPI API token ------------------------------
        MINT_FILE="$(mktemp)"
        MINT_STATUS="000"
        for retry in 1 2 3; do
          MINT_STATUS=$(curl -s -o "$MINT_FILE" -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            https://pypi.org/_/oidc/mint-token \
            -d "{\"token\":\"${OIDC_TOKEN}\"}") || MINT_STATUS="000"
          [ "$MINT_STATUS" = "200" ] && break
          echo "mint-token attempt $retry failed (HTTP $MINT_STATUS), retrying in 3s..."
          sleep 3
        done
        if [ "$MINT_STATUS" != "200" ]; then
          echo "::error::PyPI refused to mint an API token (HTTP $MINT_STATUS)."
          echo "  Hint: add a Trusted Publisher at https://pypi.org/manage/account/publishing/ for"
          echo "  owner '${{ github.repository_owner }}', repository '${{ github.repository }}'."
          cat "$MINT_FILE" >&2
          rm -f "$MINT_FILE"
          exit 1
        fi
        PYPI_TOKEN=$(python3 -c "import json; print(json.load(open('${MINT_FILE}'))['token'])")
        rm -f "$MINT_FILE"
        [ -n "$PYPI_TOKEN" ] || { echo "::error::PyPI minted an empty token."; exit 1; }

        # -- preflight 4: dist/ has wheel/sdist files ----------------------
        WD="${WD%/}"
        [ -n "$WD" ] || WD="."
        shopt -s nullglob
        DIST_FILES=("$WD"/dist/*.whl "$WD"/dist/*.tar.gz)
        shopt -u nullglob
        if [ "${#DIST_FILES[@]}" -eq 0 ]; then
          echo "::error::no wheel/sdist found in '$WD/dist/'. Run a build step (mode: full) before publishing, or set inputs.working-directory to the folder that contains dist/."
          exit 1
        fi
        echo "uploading ${#DIST_FILES[@]} distribution(s):"
        printf '  %s\n' "${DIST_FILES[@]}"

        python3 -m pip install --quiet --upgrade twine
        EXTRA=()
        [ "$SKIP_EXISTING" = "true" ] && EXTRA+=(--skip-existing)
        TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_TOKEN" \
          python3 -m twine upload --non-interactive --repository-url "$PYPI_URL" "${EXTRA[@]}" "${DIST_FILES[@]}"