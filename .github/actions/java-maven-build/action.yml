name: Build Java (Maven)
description: >-
  Build a Java project with Maven. Runs tests optionally, packages the jar,
  and collects artifacts into the output directory.

inputs:
  command:
    description: "Maven goal(s), e.g. package, test, install."
    required: false
    default: package
  args:
    description: "Extra mvn arguments (e.g. '-DskipTests -Dmaven.javadoc.skip=true')."
    required: false
    default: ""
  mvn-version:
    description: "Maven version (empty = use wrapper ./mvnw or system mvn)."
    required: false
    default: ""
  mvn-repo:
    description: "Path to Maven repo dir (empty = use bundled/global)."
    required: false
    default: ""
  java-version:
    description: "JDK version."
    required: false
    default: "17"
  java-distribution:
    description: "JDK distribution (temurin, zulu, corretto...)."
    required: false
    default: temurin
  working-directory:
    description: "Directory containing pom.xml (relative to repo root)."
    required: false
    default: "."
  output-dir:
    description: "Directory to collect build artifacts into."
    required: false
    default: "dist"
  artifact-globs:
    description: "Space-separated globs for artifacts (relative to working-dir). Empty = auto-detect."
    required: false
    default: ""
  upload:
    description: "Upload artifacts via actions/upload-artifact (true/false)."
    required: false
    default: "true"
  artifact-name:
    description: "Name prefix for uploaded artifact."
    required: false
    default: "java"

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Setup Maven
      if: inputs.mvn-version != ''
      uses: actions/setup-java@v6
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        mvn-version: ${{ inputs.mvn-version }}

    - name: Build (mvn)
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |-
        set -uo pipefail
        MVN="mvn"
        if [ ! -x ./mvnw ] && [ -f ./mvnw ]; then
          MVN="bash ./mvnw"
        elif [ -x ./mvnw ]; then
          MVN="./mvnw"
        fi
        CMD="${{ inputs.command }}"
        ARGS="${{ inputs.args }}"
        echo "::group::$MVN $CMD $ARGS -B"
        $MVN "$CMD" $ARGS -B
        RC=$?
        echo "::endgroup::"
        exit $RC

    - name: Collect artifacts
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        BUILD_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |-
        source "${{ github.action_path }}/../lib-build/build.bash"
        OUT="$(bb_outdir "$BUILD_OUTPUT_DIR")"
        GLOBS="${{ inputs.artifact-globs }}"
        if [ -z "$GLOBS" ]; then
          GLOBS="target/*.jar target/*.war target/*-shaded.jar"
        fi
        echo "::group::collecting artifacts"
        bb_collect "$OUT" $GLOBS
        echo "::endgroup::"
        echo "collected in $OUT: $(ls "$OUT" 2>/dev/null | wc -l) file(s)"

    - name: Upload artifacts
      if: inputs.upload == 'true' && inputs.output-dir == 'dist'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/dist/
        retention-days: 14
        if-no-files-found: warn