# Thin OpenCode automation — copy into any project, replace the PROMPT,
# done. Git identity, model fallback chain, and the runner logic live in the
# shared `opencode` action and update automatically at @main.
#
# Triggers as needed: workflow_dispatch, schedule, issue_comment, issues.
name: OpenCode Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    name: OpenCode task
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: YOUR_ORG/gha-workflows/.github/actions/opencode@main
        with:
          prompt: |
            REPLACE_WITH_PROJECT_PROMPT
          provider: opencode        # opencode | google | openai | mistral | anthropic | x | deepseek | groq | puter | ollama
          model: deepseek-v4-flash-free
          api-key: ${{ secrets.OPENCODE_API_KEY }}
          fallback-provider: opencode
          fallback-model: gpt-4o-mini
          fallback-api-key: ${{ secrets.OPENCODE_API_KEY }}

      - name: Commit changes (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: opencode automation [skip ci]"
            git push origin HEAD
          else
            echo "no changes to commit"
          fi