# Thin OpenCode automation — copy into any project, replace the PROMPT,
# done. Git identity, model fallback chain, and the runner logic live in the
# shared `opencode` action and update automatically at @main.
#
# Triggers as needed: workflow_dispatch, schedule, issue_comment, issues.
name: OpenCode Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    name: OpenCode task
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: OseMine/workflows/.github/actions/opencode@main
        with:
          prompt: |
            REPLACE_WITH_PROJECT_PROMPT
          provider: ${{ vars.AI_PROVIDER || 'opencode' }}            # opencode | google | openai | mistral | anthropic | x | deepseek | groq | puter | ollama
          model: ${{ vars.AI_MODEL || 'auto-free' }}
          api-key: ${{ secrets.AI_API_KEY || secrets.OPENCODE_API_KEY }}
          fallback-provider: ${{ vars.AI_FALLBACK_PROVIDER || 'opencode' }}
          fallback-model: ${{ vars.AI_FALLBACK_MODEL || 'auto-free' }}
          fallback-api-key: ${{ secrets.AI_API_KEY || secrets.OPENCODE_API_KEY }}
          # --- custom OpenAI-compatible API (optional, replaces provider/model above) ---
          # provider: custom
          # model: my-model          # model id your API accepts
          # custom-api-base: https://api.example.com/v1
          # custom-api-key: ${{ secrets.CUSTOM_API_KEY }}
          timeout-minutes: "50"

      - name: Commit changes (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: opencode automation [skip ci]"
            git push origin HEAD
          else
            echo "no changes to commit"
          fi