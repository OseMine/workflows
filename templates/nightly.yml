# Nightly build/smoke template — copy into any project.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Nightly checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: OseMine/workflows/.github/actions/ci@v1
        with:
          language: ${{ vars.CI_LANGUAGE || 'auto' }}
          rust-toolchain: stable

      # Extend with your stack's build actions, e.g.:
      # - uses: OseMine/workflows/.github/actions/flutter-build@v1

      - run: echo "Nightly checks completed"